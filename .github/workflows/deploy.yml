# Nama workflow
name: Deploy to cPanel via FTP

# Pemicu: Berjalan setiap kali ada push ke branch 'main'
on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    # Menggunakan Ubuntu versi terbaru
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode dari repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup PHP dan Composer
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2" # Sesuaikan dengan versi PHP proyek Anda
          extensions: mbstring, dom, fileinfo, mysql
          tools: composer

      # 3. Install dependensi Composer
      # Ini akan membuat folder /vendor di dalam runner
      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader

      # 6. Unggah file inti aplikasi (termasuk /vendor) ke /laravel_core
      - name: Deploy Core Files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /laravel_core/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            public/

      # 7. Unggah file publik (termasuk aset yang sudah di-build) ke /public_html
      - name: Deploy Public Files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./public/
          server-dir: /public_html/
