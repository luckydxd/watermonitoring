# Nama workflow yang akan muncul di tab "Actions" GitHub
name: Deploy to cPanel via FTP

# Pemicu: Workflow ini akan berjalan setiap kali ada 'push' ke branch 'main'
on:
  push:
    branches:
      - main # Ganti 'main' jika branch utama Anda bernama 'master'

jobs:
  ftp-deploy:
    # Menggunakan sistem operasi Ubuntu versi terbaru untuk menjalankan job
    runs-on: ubuntu-latest

    steps:
      # Langkah 1: Checkout kode dari repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Ambil semua history, penting agar FTP action bisa mendeteksi perubahan file
          fetch-depth: 0

      # Langkah 2: Unggah file inti aplikasi ke /laravel_core
      - name: FTP Deploy Core Files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          # Ambil detail koneksi dari "Secrets" di repository GitHub Anda
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          # --- PERUBAHAN PENTING DI SINI ---
          protocol: ftps # Gunakan FTPS (FTP over SSL/TLS)
          port: 21 # Port tetap 21 untuk FTPS eksplisit
          security: loose # Opsi ini membantu jika server menggunakan sertifikat self-signed
          timeout: 60000 # Tambahkan timeout lebih lama (60 detik)

          # Direktori tujuan di server Anda
          server-dir: /laravel_core/

          # Mengecualikan folder public dan file-file yang tidak perlu diunggah
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            public/**

      # Langkah 3: Unggah file dari folder /public ke /public_html
      - name: FTP Deploy Public Files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          # Detail koneksi yang sama
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          # --- PERUBAHAN PENTING DI SINI ---
          protocol: ftps
          port: 21
          security: loose
          timeout: 60000

          # Direktori sumber di repository Anda (folder public)
          local-dir: ./public/
          # Direktori tujuan di server Anda
          server-dir: /public_html/
