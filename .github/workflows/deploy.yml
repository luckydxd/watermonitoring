# Nama workflow yang akan muncul di tab "Actions" GitHub
name: Deploy to cPanel on Push

# Pemicu: Workflow ini akan berjalan setiap kali ada 'push' ke branch 'main'
on:
  push:
    branches:
      - main # Ganti 'main' jika branch utama Anda bernama 'master'

jobs:
  deploy:
    # Menggunakan sistem operasi Ubuntu versi terbaru untuk menjalankan job
    runs-on: ubuntu-latest

    steps:
      # Langkah 1: Checkout kode dari repository
      # Ini diperlukan agar workflow bisa mengakses kode Anda
      - name: Checkout code
        uses: actions/checkout@v4

      # Langkah 2: Hubungkan ke server dan jalankan perintah deployment
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          # Ambil detail koneksi dari "Secrets" di repository GitHub Anda
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          
          # Script yang akan dijalankan di server Anda
          script: |
          
            cd /home/simn3815/laravel_core
            
            git pull origin main

            cp -ruv public/demo2/assets/js/* ../public_html/demo2/assets/js/
            
            composer install --no-interaction --prefer-dist --optimize-autoloader
      
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear
            php artisan optimize:clear

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize

            
       

